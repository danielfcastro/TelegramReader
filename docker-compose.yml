version: '3'
services:
  telegram_signal_reader:
    build: .
    container_name: telegram_signal_reader
    command: python TelegramSignalReader.py
    volumes:
      - .:/app
    restart: unless-stopped

  trade_executor:
    build: .
    container_name: trade_executor
    command: python TradeExecutor.py
    volumes:
      - .:/app
    restart: unless-stopped
